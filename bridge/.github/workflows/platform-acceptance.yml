name: CoNest platform acceptance
on:
  workflow_dispatch:
jobs:
  native-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Install exact host and candidate plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OPENCLAW_STATE_DIR = Join-Path $env:RUNNER_TEMP 'conest-install'
          $env:OPENCLAW_CONFIG_PATH = Join-Path $env:OPENCLAW_STATE_DIR 'openclaw.json'
          npm install --prefix "$env:RUNNER_TEMP/conest-host" --ignore-scripts --no-audit --no-fund openclaw@2026.9.2
          if ($LASTEXITCODE -ne 0) { throw 'Host installation failed' }
          node "$env:RUNNER_TEMP/conest-host/node_modules/openclaw/openclaw.mjs" plugins install --force --accept-capabilities ./releases/0.6.3/win32-x64/local-conest-connector-0.6.3.tgz
          if ($LASTEXITCODE -ne 0) { throw 'Plugin installation failed' }
          $Plugin = Join-Path $env:OPENCLAW_STATE_DIR 'extensions/dsh-bridge'
          node "$Plugin/dist/probe-platform.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime probe failed' }
          $env:CONEST_DEMO_STATE = Join-Path $env:RUNNER_TEMP 'conest-demo'
          $env:CONEST_DEMO_PORT = '18792'
          node "$Plugin/dist/demo-studio.mjs" --verify
          if ($LASTEXITCODE -ne 0) { throw 'Gateway / dual-loop acceptance failed' }
